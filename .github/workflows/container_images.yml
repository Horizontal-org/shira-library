---
name: "Publish Docker image"
on:
  push:
    branches:
    - "main"
    tags:
    - "*"
jobs:
  push_to_registry:
    name: "Push Docker image to Docker Hub"
    runs-on: "ubuntu-latest"
    permissions:
      packages: "write"
      contents: "read"
      attestations: "write"
      id-token: "write"
    steps:
      - name: "Log in to Docker Hub"
        uses: "docker/login-action@v4.7.0"
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"
      - name: "Extract metadata (tags, labels) for Docker"
        id: "library-meta"
        uses: "docker/metadata-action@v6.2.0"
        with:
          images: "horizontalorg/shira-library"
      - name: "Build and push Docker image"
        id: "library-push"
        uses: "docker/build-push-action@v7.4.0"
        with:
          push: true
          tags: "${{ steps.library-meta.outputs.tags }}"
          labels: "${{ steps.library-meta.outputs.labels }}"
      - name: "Generate artifact attestation"
        uses: "actions/attest@v4"
        with:
          subject-name: "index.docker.io/horizontalorg/shira-library"
          subject-digest: "${{ steps.library-push.outputs.digest }}"
          push-to-registry: true
      - uses: "mattermost/action-mattermost-notify@master"
        if: "success()"
        with:
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MATTERMOST_WEBHOOK_URL }}"
          PAYLOAD: |-
            {
              "text": "Images built for ${{ github.repository }} ${{ steps.library-meta.outputs.tags }}",
              "channel": "github-actions",
              "username": "${{ github.triggering_actor }}",
              "color": "#3f6a3a"
            }
      - uses: "mattermost/action-mattermost-notify@master"
        if: "failure()"
        with:
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MATTERMOST_WEBHOOK_URL }}"
          PAYLOAD: |-
            {
              "text": "Images failed to build for ${{ github.repository }} ${{ steps.library-meta.outputs.tags }}\n\nhttps://github.com/Horizontal-org/shira-library/actions/runs/${{ github.run_id }}",
              "channel": "github-actions",
              "username": "${{ github.triggering_actor }}",
              "color": "#ff0000"
            }
